<!-- The type is served from this site (src/fonts, declared at the top of
     style.css), so the first paint waits on no other origin. The faces the
     first screen is set in are asked for here, beside the stylesheet,
     rather than after it has been parsed. -->

<link rel="stylesheet" href="/src/styles/style.css">

<script>
(function () {
    var root = document.documentElement;
    try {
        var saved = localStorage.getItem('pg-theme');
        if (saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved);
    } catch (e) {}
    root.classList.add('js');

    /* The intro plays on the first page of a session only, and never for
       reduced motion. Blocked storage counts as seen. */
    var seen = true;
    try { seen = sessionStorage.getItem('pg-intro') === 'seen'; } catch (e) {}
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!seen && !reduce) root.classList.add('is-intro');
    try { sessionStorage.setItem('pg-intro', 'seen'); } catch (e) {}
})();
</script>
