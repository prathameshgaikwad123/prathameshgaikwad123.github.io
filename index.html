<!-- The icon is the portrait, at the crop the header's chip draws: the same
     face in a tab, on a phone's bookmark and on a home screen, rather than a
     monogram in one place and a photograph in the other. /favicon.ico holds
     16, 32 and 48 for a tab and is at the root where a browser looks for it
     unprompted; the 192 is for everything that would rather have a PNG; the
     180 is what iOS puts on a home screen; the manifest is what Android
     reads for the same thing. All four are cut from one square — see
     ASSETS.md. -->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<!-- The label under the icon on an iOS home screen, and initials for the
     same reason the manifest's name is: a home screen and a launch screen
     are places the mark has to carry itself, and a full name and a job
     title printed under it are a caption on a face. The name belongs to
     the document — title, Open Graph, structured data — not to the icon. -->
<meta name="apple-mobile-web-app-title" content="PG">

<!-- Resolve the theme before first paint so there is no flash. Only an
     explicit user choice is ever written to storage; otherwise the system
     preference is followed on every visit. The .js class enables the
     entrance motion and the work-index preview plate. The intro is
     settled here too, for the same reason: the page is never briefly
     visible behind it. It plays on the first page of a session only, and
     not at all for reduced motion. -->
<script>
(function () {
    var root = document.documentElement;
    try {
        var saved = localStorage.getItem('pg-theme');
        if (saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved);
    } catch (e) { /* storage blocked — fall through to the system preference */ }
    root.classList.add('js');

    /* Blocked storage counts as seen: a session that cannot be marked
       would otherwise open on the intro at every step. */
    var seen = true;
    try { seen = sessionStorage.getItem('pg-intro') === 'seen'; } catch (e) {}
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!seen && !reduce) root.classList.add('is-intro');
    try { sessionStorage.setItem('pg-intro', 'seen'); } catch (e) {}
})();
</script>
