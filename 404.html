<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Page not found — Prathamesh Gaikwad</title>
<meta name="description" content="That page could not be found.">
<meta name="robots" content="noindex, follow">

<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="apple-mobile-web-app-title" content="PG">

<!-- The type is served from this site (src/fonts, declared at the top of
     style.css), so the first paint waits on no other origin. The faces the
     first screen is set in are asked for here, beside the stylesheet,
     rather than after it has been parsed. -->
<link rel="preload" href="/src/fonts/castoro-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/src/fonts/castoro-italic-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/src/styles/style.css">

<script>
(function () {
    var root = document.documentElement;
    try {
        var saved = localStorage.getItem('pg-theme');
        if (saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved);
    } catch (e) {}
    root.classList.add('js');

    /* The intro plays on the first page of a session only, and never for
       reduced motion. Blocked storage counts as seen. */
    var seen = true;
    try { seen = sessionStorage.getItem('pg-intro') === 'seen'; } catch (e) {}
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!seen && !reduce) root.classList.add('is-intro');
    try { sessionStorage.setItem('pg-intro', 'seen'); } catch (e) {}
})();
</script>
</head>

<body id="top">
<div id="root"></div>
<script type="module" src="/src/notfound.jsx"></script>
</body>
</html>
