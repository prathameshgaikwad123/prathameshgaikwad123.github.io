<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Page not found — Prathamesh Gaikwad</title>
<meta name="description" content="That page could not be found.">
<meta name="robots" content="noindex, follow">

<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Castoro:ital@0;1&amp;family=Inter:wght@400..600&amp;display=swap">
<link rel="stylesheet" href="/src/styles/style.css">

<script>
(function () {
    var root = document.documentElement;
    try {
        var saved = localStorage.getItem('pg-theme');
        if (saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved);
    } catch (e) {}
    root.classList.add('js');

    /* The intro plays on the first page of a session only, and never for
       reduced motion. Blocked storage counts as seen. */
    var seen = true;
    try { seen = sessionStorage.getItem('pg-intro') === 'seen'; } catch (e) {}
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!seen && !reduce) root.classList.add('is-intro');
    try { sessionStorage.setItem('pg-intro', 'seen'); } catch (e) {}
})();
</script>
</head>

<body id="top">
<div id="root"></div>
<script type="module" src="/src/notfound.jsx"></script>
</body>
</html>
