name: Deploy to GitHub Pages

# The site is no longer served straight from the repository: it is built by
# Vite and the contents of dist/ are what gets published. For this to run,
# set Settings → Pages → Build and deployment → Source to "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The live-presence footer asks a serverless function for its two
      # numbers, and where that function is has to be decided at build
      # time — src/hooks/usePresence.js reads it through import.meta.env,
      # so Vite inlines it. Unset, it compiles to the same-origin
      # /api/presence, which is right when the pages and the function are
      # deployed together and is simply a path that answers 404 here — in
      # which case the footer renders without it and nothing else changes.
      # Set the repository variable to the function's absolute URL if it
      # lives somewhere else. It is a variable rather than a secret: it is
      # a public URL, and it ends up in public JavaScript either way.
      - run: npm run build
        env:
          VITE_PRESENCE_ENDPOINT: ${{ vars.VITE_PRESENCE_ENDPOINT }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
