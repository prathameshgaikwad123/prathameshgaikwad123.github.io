<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PG monogram">
  <style>
    .bg { fill: #000000; }
    .fg { fill: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #FFFFFF; }
      .fg { fill: #000000; }
    }
  </style>
  <rect class="bg" width="64" height="64"/>
  <text class="fg" x="32" y="32"
        font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="26" font-weight="700" letter-spacing="0.5"
        text-anchor="middle" dominant-baseline="central">PG</text>
</svg>
